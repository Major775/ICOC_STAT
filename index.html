        function saveStatsDirect() {
            const y = document.getElementById('ss-year')?.value || '2025';
            const m = document.getElementById('ss-mois')?.value || '01';
            const ville = myVille() || document.getElementById('ss-ville-select')?.value || 'Man';
            const key = y + '-' + m + '-' + ville;

            function getVal(id) {
                const el = document.getElementById(id);
                if (!el) return 0;
                const v = parseInt(el.value);
                return isNaN(v) ? 0 : v;
            }

            const effH = getVal('ss-effH');
            const effF = getVal('ss-effF');

            const mov = {};
            STATS_TYPES.forEach(st => {
                mov[st.key + 'H'] = getVal('ss-' + st.key + 'H');
                mov[st.key + 'F'] = getVal('ss-' + st.key + 'F');
            });

            const baptH = mov.baptH,
                baptF = mov.baptF;
            const restH = mov.restH,
                restF = mov.restF;
            const arrH = mov.arrH,
                arrF = mov.arrF;
            const depH = mov.depH,
                depF = mov.depF;
            const retroH = mov.retroH,
                retroF = mov.retroF;
            const decH = mov.decH,
                decF = mov.decF;
            const assistMoy = getVal('ss-assist');

            const finH = effH + baptH + restH + arrH - depH - retroH - decH;
            const finF = effF + baptF + restF + arrF - depF - retroF - decF;

            DB.statsM[key] = {
                effH, effF,
                baptH, baptF,
                restH, restF,
                arrH, arrF,
                depH, depF,
                retroH, retroF,
                decH, decF,
                assistMoy
            };

            const nextMonth = new Date(parseInt(y), parseInt(m) - 1 + 1, 1);
            const nextKey = nextMonth.getFullYear() + '-' + String(nextMonth.getMonth() + 1).padStart(2, '0') + '-' +
            ville;
            if (!DB.statsM[nextKey]) {
                DB.statsM[nextKey] = { effH: finH, effF: finF, baptH: 0, baptF: 0, restH: 0, restF: 0, arrH: 0, arrF: 0,
                    depH: 0, depF: 0, retroH: 0, retroF: 0, decH: 0, decF: 0, assistMoy: 0 };
            } else {
                DB.statsM[nextKey].effH = finH;
                DB.statsM[nextKey].effF = finF;
            }

            const moisNom = MOIS_NOMS[parseInt(m) - 1];
            const dateStr = y + '-' + m + '-01';

            const typesMouv = [
                { type: 'Baptême', H: baptH, F: baptF, nomH: 'Nouveau baptisé', nomF: 'Nouvelle baptisée' },
                { type: 'Restauration', H: restH, F: restF, nomH: 'Restauré', nomF: 'Restaurée' },
                { type: 'Arrivée', H: arrH, F: arrF, nomH: 'Nouvel arrivant', nomF: 'Nouvelle arrivante' },
                { type: 'Départ', H: depH, F: depF, nomH: 'Départ', nomF: 'Départ' },
                { type: 'Rétrogradé', H: retroH, F: retroF, nomH: 'Rétrogradé', nomF: 'Rétrogradée' },
                { type: 'Décès', H: decH, F: decF, nomH: 'Décédé', nomF: 'Décédée' }
            ];

            typesMouv.forEach(t => {
                if (t.H > 0) {
                    for (let i = 0; i < t.H; i++) {
                        DB.mouvements.push({
                            id: getNextId(DB.mouvements),
                            date: dateStr,
                            type: t.type,
                            nom: t.nomH,
                            prenom: '(Frère ' + (i + 1) + ')',
                            genre: 'H',
                            detail: t.type + ' - ' + moisNom + ' ' + y + ' (' + ville + ')',
                            ville: ville
                        });
                    }
                }
                if (t.F > 0) {
                    for (let i = 0; i < t.F; i++) {
                        DB.mouvements.push({
                            id: getNextId(DB.mouvements),
                            date: dateStr,
                            type: t.type,
                            nom: t.nomF,
                            prenom: '(Sœur ' + (i + 1) + ')',
                            genre: 'F',
                            detail: t.type + ' - ' + moisNom + ' ' + y + ' (' + ville + ')',
                            ville: ville
                        });
                    }
                }
            });

            saveData();
            showNotification('✓ Stats enregistrées pour ' + ville + ' - Effectif fin: ' + finH + ' Frères, ' + finF +
                ' Sœurs', 'success');
            renderStatsTable();
            updateBadges();
            if (currentPage === 'mouvements') buildMouvements(document.getElementById('page-mouvements'));
        }

        function renderStatsTable() {
            const year = document.getElementById('stats-year')?.value || '2025';
            const selectedCity = document.getElementById('stats-city')?.value || 'Toutes';

            const sections = [
                ['Effectif début', 'eff'],
                ['Baptême', 'bapt'],
                ['Restauration', 'rest'],
                ['Arrivées', 'arr'],
                ['Départs', 'dep'],
                ['Rétrogradés', 'retro'],
                ['Décès', 'dec'],
                ['Effectif fin (calc.)', 'fin'],
                ['Croissance', 'crois']
            ];

            let thead =
                `<table class="dtable" style="min-width:1000px"><thead><tr style="background:rgba(124,58,237,.15)"><th style="width:130px">Mois</th>${sections.map(s => '<th colspan="3" style="text-align:center;border-left:1px solid rgba(255,255,255,.1)">'+s[0]+'</th>').join('')}<th>Assis.</th></tr><tr><th></th>${sections.map(() => '<th>F</th><th>S</th><th>Tot</th>').join('')}<th></th></tr></thead><tbody>`;
            let rows = '';

            MOIS_NOMS.forEach((mois, i) => {
                const monthKey = year + '-' + String(i + 1).padStart(2, '0');
                let s = null;
                if (selectedCity === 'Toutes') {
                    s = { effH: 0, effF: 0, baptH: 0, baptF: 0, restH: 0, restF: 0, arrH: 0, arrF: 0, depH: 0,
                        depF: 0, retroH: 0, retroF: 0, decH: 0, decF: 0, assistMoy: 0 };
                    Object.keys(DB.statsM).forEach(key => {
                        if (key.startsWith(monthKey + '-')) {
                            const data = DB.statsM[key];
                            for (let field in s) {
                                if (field !== 'assistMoy') s[field] += data[field] || 0;
                            }
                            s.assistMoy += data.assistMoy || 0;
                        }
                    });
                    const count = Object.keys(DB.statsM).filter(k => k.startsWith(monthKey + '-')).length;
                    if (count > 0) s.assistMoy = Math.round(s.assistMoy / count);
                } else {
                    const key = monthKey + '-' + selectedCity;
                    s = DB.statsM[key] || {};
                }

                const hasData = Object.keys(s).length > 0 && (s.effH || s.effF);

                function getVals(sk) {
                    if (sk === 'eff') return [s.effH || 0, s.effF || 0];
                    if (sk === 'bapt') return [s.baptH || 0, s.baptF || 0];
                    if (sk === 'rest') return [s.restH || 0, s.restF || 0];
                    if (sk === 'arr') return [s.arrH || 0, s.arrF || 0];
                    if (sk === 'dep') return [s.depH || 0, s.depF || 0];
                    if (sk === 'retro') return [s.retroH || 0, s.retroF || 0];
                    if (sk === 'dec') return [s.decH || 0, s.decF || 0];
                    if (sk === 'fin') {
                        const effH = s.effH || 0;
                        const effF = s.effF || 0;
                        const finH = effH + (s.baptH || 0) + (s.restH || 0) + (s.arrH || 0) - (s.depH || 0) - (s
                            .retroH || 0) - (s.decH || 0);
                        const finF = effF + (s.baptF || 0) + (s.restF || 0) + (s.arrF || 0) - (s.depF || 0) - (s
                            .retroF || 0) - (s.decF || 0);
                        return [finH, finF];
                    }
                    if (sk === 'crois') {
                        const effH = s.effH || 0;
                        const effF = s.effF || 0;
                        const finH = effH + (s.baptH || 0) + (s.restH || 0) + (s.arrH || 0) - (s.depH || 0) - (s
                            .retroH || 0) - (s.decH || 0);
                        const finF = effF + (s.baptF || 0) + (s.restF || 0) + (s.arrF || 0) - (s.depF || 0) - (s
                            .retroF || 0) - (s.decF || 0);
                        return [finH - effH, finF - effF];
                    }
                    return [0, 0];
                }

                rows += '<tr' + (hasData ? ' style="background:rgba(124,58,237,.05)"' : '') + '><td style="font-weight:600;white-space:nowrap">' +
                    mois + ' <span style="font-size:10px;color:var(--text3)">' + year + '</span></td>' +
                    sections.map(sec => { const sk = sec[1]; const vals = getVals(sk); const h = vals[0],
                            f = vals[1]; const t = h + f; let col = ''; if (sk === 'crois') { col = t > 0 ?
                                'var(--green)' : t < 0 ? 'var(--red)' : 'var(--text3)'; } const style = col ?
                            'color:' + col + ';font-weight:700' : ''; return '<td style="text-align:center;' +
                            style + '">' + (h || '—') + '</td><td style="text-align:center;' + style + '">' + (
                            f || '—') + '</td><td style="text-align:center;font-weight:600;' + (col ? 'color:' +
                            col : '') + '">' + (t || '—') + '</td>'; }).join('') +
                    '<td style="text-align:center">' + (s.assistMoy || '—') + '</td></tr>';
            });

            const totalRows = sections.map(sec => {
                const sk = sec[1];
                let totH = 0,
                    totF = 0;
                if (selectedCity === 'Toutes') {
                    Object.keys(DB.statsM).forEach(key => {
                        if (key.startsWith(year)) {
                            const data = DB.statsM[key];
                            if (sk === 'eff' || sk === 'fin' || sk === 'crois') return;
                            totH += data[sk + 'H'] || 0;
                            totF += data[sk + 'F'] || 0;
                        }
                    });
                } else {
                    for (let i = 1; i <= 12; i++) {
                        const key = year + '-' + String(i).padStart(2, '0') + '-' + selectedCity;
                        const data = DB.statsM[key] || {};
                        if (sk === 'eff' || sk === 'fin' || sk === 'crois') return '<td style="text-align:center">—</td><td style="text-align:center">—</td><td style="text-align:center">—</td>';
                        totH += data[sk + 'H'] || 0;
                        totF += data[sk + 'F'] || 0;
                    }
                }
                if (sk === 'eff' || sk === 'fin' || sk === 'crois') return '<td style="text-align:center">—</td><td style="text-align:center">—</td><td style="text-align:center">—</td>';
                return '<td style="text-align:center">' + totH + '</td><td style="text-align:center">' + totF +
                    '</td><td style="text-align:center">' + (totH + totF) + '</td>';
            }).join('');

            rows +=
                '<tr style="background:rgba(124,58,237,.18);font-weight:700"><td>TOTAL</td>' + totalRows +
                '<td></td></tr>';
            document.getElementById('stats-body').innerHTML = thead + rows + '</tbody></table>';

            setTimeout(() => {
                const year2 = document.getElementById('stats-year')?.value || '2025';
                const labels = MOIS_NOMS.map(m => m.slice(0, 3));
                let effData = [],
                    arrData = [],
                    depData = [];
                const city = document.getElementById('stats-city')?.value || 'Toutes';

                if (city === 'Toutes') {
                    for (let i = 0; i < 12; i++) {
                        const m = String(i + 1).padStart(2, '0');
                        let eff = 0,
                            arr = 0,
                            dep = 0;
                        Object.keys(DB.statsM).forEach(key => {
                            if (key.startsWith(year2 + '-' + m + '-')) {
                                const data = DB.statsM[key];
                                eff += (data.effH || 0) + (data.effF || 0);
                                arr += (data.arrH || 0) + (data.arrF || 0);
                                dep += (data.depH || 0) + (data.depF || 0);
                            }
                        });
                        effData.push(eff);
                        arrData.push(arr);
                        depData.push(dep);
                    }
                } else {
                    for (let i = 0; i < 12; i++) {
                        const m = String(i + 1).padStart(2, '0');
                        const key = year2 + '-' + m + '-' + city;
                        const data = DB.statsM[key] || {};
                        effData.push((data.effH || 0) + (data.effF || 0));
                        arrData.push((data.arrH || 0) + (data.arrF || 0));
                        depData.push((data.depH || 0) + (data.depF || 0));
                    }
                }

                const ctx1 = document.getElementById('chart-stats-evo');
                if (ctx1) { if (chartInstances['cs-evo']) chartInstances['cs-evo'].destroy();
                    chartInstances['cs-evo'] = new Chart(ctx1, { type: 'line', data: { labels, datasets: [{ label: 'Effectif',
                                data: effData, borderColor: '#818CF8', backgroundColor: 'rgba(99,102,241,.12)',
                                fill: true, tension: 0.4, pointRadius: 4, pointBackgroundColor: '#818CF8' }] },
                        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: 'rgba(148,163,184,1)',
                                        font: { size: 11 } } } }, scales: { x: { grid: { display: false },
                                    ticks: { color: 'rgba(100,116,139,1)' } }, y: { grid: { color: 'rgba(255,255,255,.05)' },
                                    ticks: { precision: 0, color: 'rgba(100,116,139,1)' } } } } }); }
                const ctx2 = document.getElementById('chart-stats-mouv');
                if (ctx2) { if (chartInstances['cs-mouv']) chartInstances['cs-mouv'].destroy();
                    chartInstances['cs-mouv'] = new Chart(ctx2, { type: 'bar', data: { labels, datasets: [{ label: 'Arrivées',
                                data: arrData, backgroundColor: 'rgba(16,185,129,.65)', borderRadius: 5 },
                            { label: 'Départs', data: depData, backgroundColor: 'rgba(239,68,68,.65)',
                                borderRadius: 5 }] }, options: { responsive: true, maintainAspectRatio: false,
                            plugins: { legend: { labels: { color: 'rgba(148,163,184,1)', font: { size: 11 } } } },
                            scales: { x: { grid: { display: false }, ticks: { color: 'rgba(100,116,139,1)' } },
                                y: { grid: { color: 'rgba(255,255,255,.05)' }, beginAtZero: true,
                                    ticks: { precision: 0, color: 'rgba(100,116,139,1)' } } } } }); }
            }, 100);
        }

            const ville = myVille() || document.getElementById('ss-ville-modal')?.value || 'Man';

            }

            const mov = {};
            STATS_TYPES.forEach(st => {
                mov[st.key + 'H'] = getVal('ss-' + st.key + 'H-modal');
                mov[st.key + 'F'] = getVal('ss-' + st.key + 'F-modal');

                restF = mov.restF;
            const arrH = mov.arrH,
                arrF = mov.arrF;
            const depH = mov.depH,
                depF = mov.depF;
            const retroH = mov.retroH,
                retroF = mov.retroF;
            const decH = mov.decH,
                decF = mov.decF;
            const assistMoy = getVal('ss-assist-modal');

            const finH = effH + baptH + restH + arrH - depH - retroH - decH;
            const finF = effF + baptF + restF + arrF - depF - retroF - decF;

            DB.statsM[key] = {
                effH, effF,
                baptH, baptF,
                restH, restF,
                arrH, arrF,
                depH, depF,
                retroH, retroF,
                decH, decF,
                assistMoy
            };

            const nextMonth = new Date(parseInt(y), parseInt(m) - 1 + 1, 1);
            const nextKey = nextMonth.getFullYear() + '-' + String(nextMonth.getMonth() + 1).padStart(2, '0') + '-' +
            ville;
            if (!DB.statsM[nextKey]) {
                DB.statsM[nextKey] = { effH: finH, effF: finF, baptH: 0, baptF: 0, restH: 0, restF: 0, arrH: 0, arrF: 0,
                    depH: 0, depF: 0, retroH: 0, retroF: 0, decH: 0, decF: 0, assistMoy: 0 };
            } else {
                DB.statsM[nextKey].effH = finH;
                DB.statsM[nextKey].effF = finF;
            }

            const moisNom = MOIS_NOMS[parseInt(m) - 1];
            const dateStr = y + '-' + m + '-01';

            const typesMouv = [
                { type: 'Baptême', H: baptH, F: baptF, nomH: 'Nouveau baptisé', nomF: 'Nouvelle baptisée' },
                { type: 'Restauration', H: restH, F: restF, nomH: 'Restauré', nomF: 'Restaurée' },
                { type: 'Arrivée', H: arrH, F: arrF, nomH: 'Nouvel arrivant', nomF: 'Nouvelle arrivante' },
                { type: 'Départ', H: depH, F: depF, nomH: 'Départ', nomF: 'Départ' },
                { type: 'Rétrogradé', H: retroH, F: retroF, nomH: 'Rétrogradé', nomF: 'Rétrogradée' },
                { type: 'Décès', H: decH, F: decF, nomH: 'Décédé', nomF: 'Décédée' }
            ];

            typesMouv.forEach(t => {
                if (t.H > 0) {
                    for (let i = 0; i < t.H; i++) {
                        DB.mouvements.push({
                            id: getNextId(DB.mouvements),
                            date: dateStr,
                            type: t.type,
                            nom: t.nomH,
                            prenom: '(Frère ' + (i + 1) + ')',
                            genre: 'H',
                            detail: t.type + ' - ' + moisNom + ' ' + y + ' (' + ville + ')',
                            ville: ville
                        });
                    }
                }
                if (t.F > 0) {
                    for (let i = 0; i < t.F; i++) {
                        DB.mouvements.push({
                            id: getNextId(DB.mouvements),
                            date: dateStr,
                            type: t.type,
                            nom: t.nomF,
                            prenom: '(Sœur ' + (i + 1) + ')',
                            genre: 'F',
                            detail: t.type + ' - ' + moisNom + ' ' + y + ' (' + ville + ')',
                            ville: ville
                        });
                    }
                }
            });

            saveData();
            closeModal();
            showNotification('✓ Stats enregistrées pour ' + ville + ' - Effectif fin: ' + finH + ' Frères, ' + finF +
                ' Sœurs', 'success');
            renderStatsTable();
            updateBadges();
            if (currentPage === 'mouvements') buildMouvements(document.getElementById('page-mouvements'));
        }

        // ============================================================
        // PAGE EXPORT
        // ============================================================
        function buildExport(container) {
            const stats = calcStats();
            const minStats = {};
            scopeMembres().filter(m => m.statut === 'Actif').forEach(m => { const k = (m.ministere || 'Autres').trim(); if (!
                    minStats[k]) minStats[k] = { H: 0, F: 0 }; minStats[k][m.genre === 'H' ? 'H' : 'F']++; });
            const minHtml = Object.keys(minStats).map(mn => { const data = minStats[mn]; return '<div style="display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--border)"><span style="flex:1;font-size:12px">' +
                    mn + '</span><span class="badge b-blue">' + data.H + ' F</span><span class="badge b-purple">' + data
                    .F + ' S</span><span class="badge b-gray">' + (data.H + data.F) + ' Total</span></div>'; }).join('');
            const dbStats = {};
            scopeMembres().filter(m => m.statut === 'Actif').forEach(m => { const k = m.egliseMaison || 'Non défini'; if (!
                    dbStats[k]) dbStats[k] = { H: 0, F: 0 }; dbStats[k][m.genre === 'H' ? 'H' : 'F']++; });
            const dbHtml = Object.keys(dbStats).map(db => { const data = dbStats[db]; return '<div style="display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--border)"><span style="flex:1;font-size:11.5px">' +
                    db + '</span><span class="badge b-blue">' + data.H + ' F</span><span class="badge b-purple">' + data
                    .F + ' S</span><span class="badge b-gray">' + (data.H + data.F) + '</span></div>'; }).join('');
            container.innerHTML =
                `<div class="card"><div class="card-head"><span class="card-title">📥 Export & Rapports</span></div><div class="card-body"><div class="g3"><div style="background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:20px;text-align:center"><i class="fas fa-table" style="font-size:28px;color:var(--green);display:block;margin-bottom:10px"></i><div style="font-weight:700;margin-bottom:6px">Registre des membres</div><div style="font-size:11.5px;color:var(--text2);margin-bottom:14px">Tous les membres en CSV</div><button class="btn btn-success btn-sm" onclick="exportCSV()"><i class="fas fa-download"></i>Télécharger CSV</button></div><div style="background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:20px;text-align:center"><i class="fas fa-arrows-alt-h" style="font-size:28px;color:var(--yellow);display:block;margin-bottom:10px"></i><div style="font-weight:700;margin-bottom:6px">Mouvements</div><div style="font-size:11.5px;color:var(--text2);margin-bottom:14px">Historique des mouvements</div><button class="btn btn-warn btn-sm" onclick="exportMouvements()"><i class="fas fa-download"></i>Télécharger CSV</button></div><div style="background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:20px;text-align:center"><i class="fas fa-chart-bar" style="font-size:28px;color:var(--accent2);display:block;margin-bottom:10px"></i><div style="font-weight:700;margin-bottom:6px">Rapport HTML</div><div style="font-size:11.5px;color:var(--text2);margin-bottom:14px">Rapport imprimable</div><button class="btn btn-primary btn-sm" onclick="exportRapport()"><i class="fas fa-print"></i>Générer rapport</button></div></div><div class="divider"></div><div style="background:var(--bg3);border-radius:12px;padding:16px;margin-top:4px"><div style="font-size:13px;font-weight:700;margin-bottom:12px">📊 Résumé rapide</div><div class="g2"><div><div style="font-size:11.5px;color:var(--text2);margin-bottom:6px;font-weight:600">Effectif par ministère :</div>${minHtml}</div><div><div style="font-size:11.5px;color:var(--text2);margin-bottom:6px;font-weight:600">Effectif par DB :</div>${dbHtml}</div></div></div><div class="divider"></div><div style="text-align:center;font-size:11.5px;color:var(--text3)"><i class="fas fa-info-circle"></i> Toutes les données sont stockées localement. Sauvegardez via les exports CSV.</div></div></div>`;
        }

        // ============================================================
        // PAGE CODES D'ACCÈS (administrateur uniquement)
        // ============================================================
        function accesVilles() { return Object.keys(DB.codes.villes).sort((a, b) => a.localeCompare(b, 'fr')); }

        function codeTaken(code, exceptVille) {
            if (exceptVille !== '__admin__' && code === normCode(DB.codes.admin)) return true;
            return Object.keys(DB.codes.villes).some(v => v !== exceptVille && normCode(DB.codes.villes[v]) === code);
        }

        function buildAcces(container) {
            if (!isAdmin()) { container.innerHTML = ''; return; }
            const rows = accesVilles().map((v, i) => {
                const nb = DB.membres.filter(m => normVille(m.ville) === normVille(v)).length;
                return `<tr>
                <td style="font-weight:700">${esc(v)}</td>
                <td><input id="code-v-${i}" value="${esc(DB.codes.villes[v])}" style="max-width:190px;letter-spacing:1px"></td>
                <td style="color:var(--text2)">${nb}</td>
                <td><div class="btn-group">
                  <button class="btn btn-success btn-sm" onclick="saveCodeVille(${i})"><i class="fas fa-save"></i>Enregistrer</button>
                  <button class="btn btn-danger btn-sm" style="padding:5px 8px" onclick="removeVille(${i})" title="Retirer l'accès"><i class="fas fa-trash"></i></button>
                </div></td></tr>`;
            }).join('');
            container.innerHTML = `
            <div class="card">
              <div class="card-head"><span class="card-title"><i class="fas fa-key" style="color:var(--accent2);margin-right:6px"></i>Codes d'accès des villes</span></div>
              <div class="card-body" style="padding:0;overflow-x:auto">
                <table class="dtable"><thead><tr><th style="text-align:left">Ville</th><th style="text-align:left">Code</th><th style="text-align:left">Membres</th><th style="text-align:left">Actions</th></tr></thead>
                <tbody>${rows || '<tr><td colspan="4"><div class="empty"><i class="fas fa-key"></i>Aucune ville</div></td></tr>'}</tbody></table>
              </div>
            </div>
            <div class="g2">
              <div class="card"><div class="card-head"><span class="card-title">Ajouter une ville</span></div><div class="card-body">
                <div class="fld"><label class="fld-lbl">Nom de la ville</label><input id="new-ville-nom" placeholder="Ex: Korhogo"></div>
                <div class="fld"><label class="fld-lbl">Code d'accès</label><input id="new-ville-code" placeholder="Ex: KGO-1234"></div>
                <div class="btn-group" style="justify-content:flex-end"><button class="btn btn-primary" onclick="addVille()"><i class="fas fa-plus"></i>Ajouter</button></div>
              </div></div>
              <div class="card"><div class="card-head"><span class="card-title">Code administrateur</span></div><div class="card-body">
                <div class="fld"><label class="fld-lbl">Code (voit toutes les villes)</label><input id="admin-code" value="${esc(DB.codes.admin)}" style="letter-spacing:1px"></div>
                <div class="btn-group" style="justify-content:flex-end"><button class="btn btn-primary" onclick="saveAdminCode()"><i class="fas fa-save"></i>Enregistrer</button></div>
              </div></div>
            </div>
            <div style="text-align:center;font-size:11.5px;color:var(--text3);margin-top:14px"><i class="fas fa-info-circle"></i> Chaque ville ne voit que ses membres, ses mouvements et ses statistiques. Les codes sont enregistrés dans ce navigateur.</div>`;
        }

        function saveCodeVille(i) {
            if (!isAdmin()) return;
            const v = accesVilles()[i];
            const code = normCode(document.getElementById('code-v-' + i).value);
            if (!v) return;
            if (code.length < 4) { showNotification('Le code doit avoir au moins 4 caractères', 'error'); return; }
            if (codeTaken(code, v)) { showNotification('Ce code est déjà utilisé', 'error'); return; }
            DB.codes.villes[v] = code;
            saveData();
            showNotification('Code de ' + v + ' mis à jour ✓');
            buildAcces(document.getElementById('page-acces'));
        }

        function addVille() {
            if (!isAdmin()) return;
            const nom = document.getElementById('new-ville-nom').value.trim();
            const code = normCode(document.getElementById('new-ville-code').value);
            if (!nom) { showNotification('Le nom de la ville est obligatoire', 'error'); return; }
            if (Object.keys(DB.codes.villes).some(v => normVille(v) === normVille(nom))) { showNotification(
                    'Cette ville existe déjà', 'error'); return; }
            if (code.length < 4) { showNotification('Le code doit avoir au moins 4 caractères', 'error'); return; }
            if (codeTaken(code, null)) { showNotification('Ce code est déjà utilisé', 'error'); return; }
            DB.codes.villes[nom] = code;
            saveData();
            showNotification('Ville ' + nom + ' ajoutée ✓');
            buildAcces(document.getElementById('page-acces'));
        }

        function removeVille(i) {
            if (!isAdmin()) return;
            const v = accesVilles()[i];
            if (!v || !confirm("Retirer l'accès de " + v + ' ? Ses données restent enregistrées.')) return;
            delete DB.codes.villes[v];
            saveData();
            showNotification('Accès de ' + v + ' retiré', 'info');
            buildAcces(document.getElementById('page-acces'));
        }

        function saveAdminCode() {
            if (!isAdmin()) return;
            const code = normCode(document.getElementById('admin-code').value);
            if (code.length < 6) { showNotification('Le code administrateur doit avoir au moins 6 caractères', 'error'); return; }
            if (codeTaken(code, '__admin__')) { showNotification('Ce code est déjà utilisé par une ville', 'error'); return; }
            DB.codes.admin = code;
            saveData();
            showNotification('Code administrateur mis à jour ✓');
            buildAcces(document.getElementById('page-acces'));
        }

        // ============================================================
        // EXPORTS
        // ============================================================
        function exportCSV() {
            const cfg = scopeConfig();
            let csv = 'REGISTRE DES MEMBRES — ÉGLISE DE ' + cfg.ville + ' — RÉGION ' + cfg.region + '\n';
            csv +=
                'N°;NOM;PRÉNOMS;CONTACT;QUARTIER;PROFESSION;DATE BAPTÊME;GENRE;MINISTÈRE;ÉGLISE DE MAISON;VILLE;NOM DIRIGEANT;FORMATEUR;STATUT\n';
            scopeMembres().forEach(m => { csv += m.id + ';' + m.nom + ';' + m.prenoms + ';' + m.contact + ';' + m.quartier +
                    ';' + m.profession + ';' + m.dateBapteme + ';' + (m.genre === 'H' ? 'Homme' : 'Femme') + ';' + m
                    .ministere + ';' + m.egliseMaison + ';' + (m.ville || '') + ';' + (m.nomDirigeant || '') + ';' + m
                    .formateur + ';' + m.statut + '\n'; });
            const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'Registre_Membres_' + cfg.ville + '_' + new Date().toISOString().split('T')[0] + '.csv';
            a.click();
            showNotification('Export CSV téléchargé ✓');
        }

        function exportMouvements() {
            let csv = 'N°;DATE;TYPE;NOM;PRÉNOM;GENRE;DÉTAIL;VILLE\n';
            scopeMouvements().forEach(m => { csv += m.id + ';' + m.date + ';' + m.type + ';' + m.nom + ';' + m.prenom + ';' + (
                    m.genre === 'H' ? 'Frère' : 'Sœur') + ';' + m.detail + ';' + (m.ville || '') + '\n'; });
            const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'Mouvements_' + new Date().toISOString().split('T')[0] + '.csv';
            a.click();
            showNotification('Export mouvements téléchargé ✓');
        }

        function exportRapport() {
            const cfg = scopeConfig();
            const stats = calcStats();
            const minStats = {};
            scopeMembres().filter(m => m.statut === 'Actif').forEach(m => { const k = (m.ministere || 'Autres').trim(); if (!
                    minStats[k]) minStats[k] = { H: 0, F: 0 }; minStats[k][m.genre === 'H' ? 'H' : 'F']++; });
            const win = window.open('', '_blank');
            if (!win) { showNotification('Veuillez autoriser les pop-ups', 'error'); return; }
            const minRows = Object.keys(minStats).map(min => { const d = minStats[min]; return '<tr><td>' + min +
                    '</td><td>' + d.H + '</td><td>' + d.F + '</td><td><strong>' + (d.H + d.F) +
                    '</strong></td></tr>'; }).join('');
            const membresRows = scopeMembres().filter(m => m.statut === 'Actif').map(m => '<tr><td>' + m.id + '</td><td><strong>' +
                    m.nom + '</strong></td><td>' + m.prenoms + '</td><td>' + (m.genre === 'H' ? 'Frère' : 'Sœur') +
                    '</td><td>' + m.ministere + '</td><td>' + (m.egliseMaison || '—') + '</td><td>' + (m.ville || '—') +
                    '</td><td>' + (m.nomDirigeant || '—') + '</td><td>' + (m.contact || '—') + '</td><td>' + (m
                    .dateBapteme || '—') + '</td></tr>').join('');
            win.document.write(
                `<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><title>Rapport Église de ${cfg.ville}</title><style>body{font-family:Arial,sans-serif;padding:30px;color:#333}h1{color:#7C3AED;border-bottom:3px solid #7C3AED;padding-bottom:8px}h2{color:#555;margin-top:20px}table{width:100%;border-collapse:collapse;margin-top:10px}th{background:#7C3AED;color:#fff;padding:8px;text-align:left;font-size:12px}td{padding:7px 8px;border-bottom:1px solid #eee;font-size:12px}tr:nth-child(even){background:#f9f9f9}.info{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0;background:#f0ebff;padding:14px;border-radius:8px}.info div{font-size:13px}</style></head><body><h1>✝ Rapport — Église de ${cfg.ville}</h1><div class="info"><div><strong>Ville :</strong> ${cfg.ville}</div><div><strong>Région :</strong> ${cfg.region}</div><div><strong>Dirigeant :</strong> ${cfg.dirigeant}</div><div><strong>Contact :</strong> ${cfg.contact}</div><div><strong>Date :</strong> ${new Date().toLocaleDateString('fr-FR')}</div></div><h2>📊 Statistiques générales</h2><table><thead><tr><th>Indicateur</th><th>Frères</th><th>Sœurs</th><th>Total</th></tr></thead><tbody><tr><td>Membres actifs</td><td>${stats.freres}</td><td>${stats.soeurs}</td><td>${stats.total}</td></tr></tbody></table><h2>⛪ Répartition par ministère</h2><table><thead><tr><th>Ministère</th><th>Frères</th><th>Sœurs</th><th>Total</th></tr></thead><tbody>${minRows}</tbody></table><h2>👥 Registre complet des membres</h2><table><thead><tr><th>N°</th><th>Nom</th><th>Prénoms</th><th>Genre</th><th>Ministère</th><th>DB</th><th>Ville</th><th>Dirigeant</th><th>Contact</th><th>Baptême</th></tr></thead><tbody>${membresRows}</tbody></table><p style="margin-top:20px;font-size:11px;color:#999;text-align:center">Rapport généré le ${new Date().toLocaleString('fr-FR')} · Application Gestion Église Man</p><script>window.print();<\/script></body></html>`
                );
            win.document.close();
        }

        // ============================================================
        // THÈME & INIT
        // ============================================================
        document.getElementById('theme-sel').addEventListener('change', function() {
            const val = this.value;
            document.body.classList.toggle('light', val === 'light');
            localStorage.setItem('eglise_theme', val);
        });
        const savedTheme = localStorage.getItem('eglise_theme');
        if (savedTheme) { document.body.classList.toggle('light', savedTheme === 'light');
            document.getElementById('theme-sel').value = savedTheme; }

        document.querySelectorAll('.nav-btn[data-page]').forEach(btn => btn.addEventListener('click', function() {
            navigateTo(this.dataset.page);
        }));

        document.getElementById('modal-overlay').addEventListener('click', function(e) { if (e.target === this)
            closeModal(); });
        document.addEventListener('keydown', function(e) { if (e.key === 'Escape') { closeModal(); toggleNav(false); } });

        renderLogo();
        applySession();
        navigateTo('accueil');
    </script>
</body>

</html>
