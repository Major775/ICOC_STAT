      --red: #EF4444; --redbg: rgba(239,68,68,0.15);
      --yellow: #F59E0B; --yellowbg: rgba(245,158,11,0.15);
      --blue: #3B82F6; --bluebg: rgba(59,130,246,0.15);
      --purple: #A855F7; --purplebg: rgba(168,85,247,0.15);

      --border: rgba(0,0,0,0.06); --border2: rgba(0,0,0,0.1);

    ::-webkit-scrollbar-track { background: transparent; }

    .sb { width: 220px; min-width: 220px; background: var(--sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; position: fixed; top: 0; left: 0; bottom: 0; z-index: 200; overflow-y: auto; }

    .tb-title { font-size: 14px; font-weight: 700; color: var(--text); }
    .tb-space { flex: 1; }
    .page { display: none; padding: 20px; min-height: calc(100vh - 52px); }
    .page.active { display: block; }

    .card-head { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .card-title { font-size: 12.5px; font-weight: 700; color: var(--text); flex: 1; }
    .card-body { padding: 16px; }

    .g4 { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; margin-bottom: 16px; }
    .g3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 14px; margin-bottom: 16px; }
    .g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

    .stat { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius2); padding: 16px; display: flex; align-items: center; gap: 12px; transition: border-color .2s; }

    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 8px; border: 1px solid var(--border2); font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600; cursor: pointer; transition: all .15s; white-space: nowrap; background: transparent; color: var(--text); }
    .btn-primary { background: linear-gradient(135deg,#7C3AED,#A78BFA); color: #fff; border-color: transparent; box-shadow: 0 2px 8px rgba(124,58,237,0.35); }

    .btn-ghost { background: transparent; color: var(--text2); }
    .btn-ghost:hover { background: rgba(255,255,255,0.05); color: var(--text); }
    .btn-sm { padding: 5px 10px; font-size: 11px; }
    .btn-danger { background: var(--redbg); color: var(--red); border-color: transparent; }

    .btn-success { background: var(--greenbg); color: var(--green); border-color: transparent; }
    .btn-success:hover { background: var(--green); color: #fff; }
    .btn-warn { background: var(--yellowbg); color: var(--yellow); border-color: transparent; }
    .btn-warn:hover { background: var(--yellow); color: #fff; }
    .btn-group { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

    .badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 12px; font-size: 10px; font-weight: 700; }
    .b-green { background: var(--greenbg); color: var(--green); }
    .b-red { background: var(--redbg); color: var(--red); }
    .b-blue { background: var(--bluebg); color: var(--blue); }
    .b-yellow { background: var(--yellowbg); color: var(--yellow); }
    .b-purple { background: var(--purplebg); color: var(--purple); }

  function loadData() {
    try { const saved = localStorage.getItem(STORAGE_KEY); if (saved) { const data = JSON.parse(saved); if (!data.config) data.config = getDefaultData().config; if (!data.membres) data.membres = getDefaultData().membres; if (!data.mouvements) data.mouvements = getDefaultData().mouvements; if (!data.statsM) data.statsM = getDefaultData().statsM; return data; } } catch(e) {}
    return getDefaultData();
  }

  function formatDate(d) { if (!d) return '—'; try { return new Date(d+'T00:00:00').toLocaleDateString('fr-FR'); } catch { return '—'; } }
  function getNextId(arr) { if (!arr || arr.length===0) return 1; return Math.max(...arr.map(item=>item.id||0))+1; }
  function showNotification(msg, type='success') {
    const zone = document.getElementById('notif-zone');
    const icons = { success:'check-circle', error:'exclamation-circle', info:'info-circle' };
    const colors = { success:'var(--green)', error:'var(--red)', info:'var(--blue)' };
    const div = document.createElement('div');
    div.className='notif-item';
    div.innerHTML='<i class="fas fa-'+icons[type]+'" style="color:'+colors[type]+'"></i> '+msg;
    zone.appendChild(div);
    setTimeout(()=>div.remove(), 3000);
  }
  function openModal(title, body, footer) { document.getElementById('modal-title').textContent=title; document.getElementById('modal-body').innerHTML=body; document.getElementById('modal-foot').innerHTML=footer||''; document.getElementById('modal-overlay').classList.add('open'); }

  const MOUV_ICONS = { 'Baptême':'droplet','Restauration':'undo','Arrivée':'sign-in-alt','Départ':'sign-out-alt','Rétrogradé':'arrow-down','Décès':'cross' };

    { label: 'Rétrogradés', key: 'retro' },
    { label: 'Décès', key: 'dec' }
  ];

  function calcStats() {
    const actifs = DB.membres.filter(m=>m.statut==='Actif');
    const freres = actifs.filter(m=>m.genre==='H').length;
    const soeurs = actifs.filter(m=>m.genre==='F').length;
    const arrivals = DB.mouvements.filter(m=>m.type==='Arrivée').length;
    const departs = DB.mouvements.filter(m=>m.type==='Départ').length;
    const baptemes = DB.mouvements.filter(m=>m.type==='Baptême').length;
    return { total: actifs.length, freres, soeurs, arrivals, departs, baptemes };
  }

  function navigateTo(page) {
    document.querySelectorAll('.nav-btn[data-page]').forEach(b=>b.classList.remove('active'));
    const activeBtn = document.querySelector('.nav-btn[data-page="'+page+'"]'); if(activeBtn) activeBtn.classList.add('active');
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    const pageEl = document.getElementById('page-'+page); if(pageEl) pageEl.classList.add('active');
    currentPage = page;
    const titles = { accueil:'Tableau de bord', membres:'Registre des membres', saisie:'Ajouter / Modifier un membre', mouvements:'Mouvements', stats:'Statistiques mensuelles', export:'Export & Rapports' };
    document.getElementById('top-title').textContent = titles[page]||page;
    updateBadges();
    renderPage(page);
  }

  function updateBadges() {
    document.getElementById('badge-mouv').textContent = DB.mouvements.length;
    const stats = calcStats();
    document.getElementById('top-info').textContent = stats.total+' membres actifs · '+stats.freres+' F / '+stats.soeurs+' S';

  function renderPage(page) {
    const container = document.getElementById('page-'+page);
    if(!container) return;
    switch(page) {
      case 'accueil': buildAccueil(container); break;

      case 'saisie': buildSaisie(container); break;
      case 'mouvements': buildMouvements(container); break;
      case 'stats': buildStats(container); break;
      case 'export': buildExport(container); break;
    }
  }

      if(m.egliseMaison&&dbs.indexOf(m.egliseMaison)===-1) dbs.push(m.egliseMaison);
      if(m.ville&&villes.indexOf(m.ville)===-1) villes.push(m.ville);
      if(m.nomDirigeant&&dirigeants.indexOf(m.nomDirigeant)===-1) dirigeants.push(m.nomDirigeant);

  function renderTableMembres() {
    const q=(document.getElementById('m-q')?.value||'').toLowerCase();
    const genre=document.getElementById('m-genre')?.value||'';
    const min=document.getElementById('m-min')?.value||'';
    const db=document.getElementById('m-db')?.value||'';
    const ville=document.getElementById('m-ville')?.value||'';
    const dirigeant=document.getElementById('m-dirigeant')?.value||'';
    const statut=document.getElementById('m-statut')?.value||'';
    let data=DB.membres.filter(m=>{
      let match=true;
      if(q) match = match && (m.nom.toLowerCase().indexOf(q)!==-1 || m.prenoms.toLowerCase().indexOf(q)!==-1 || (m.quartier||'').toLowerCase().indexOf(q)!==-1);
      if(genre) match = match && m.genre===genre;
      if(min) match = match && (m.ministere||'').trim()===min;
      if(db) match = match && m.egliseMaison===db;
      if(ville) match = match && m.ville===ville;
      if(dirigeant) match = match && m.nomDirigeant===dirigeant;
      if(statut) match = match && m.statut===statut;
      return match;
    });
    const countEl=document.getElementById('m-count'); if(countEl) countEl.textContent=data.length+' membre(s)';
    const tbody=document.getElementById('tbody-membres'); if(!tbody) return;
    if(data.length===0){ tbody.innerHTML='<tr><td colspan="14"><div class="empty"><i class="fas fa-users"></i>Aucun membre trouvé</div></td></tr>'; return; }
    tbody.innerHTML=data.map(m=>
      '<tr onclick="voirMembre('+m.id+')">'+
        '<td style="color:var(--text3);font-size:11px">'+m.id+'</td>'+
        '<td style="font-weight:700">'+m.nom+'</td><td>'+m.prenoms+'</td>'+
        '<td style="font-size:11.5px">'+(m.contact||'—')+'</td>'+
        '<td style="font-size:11.5px">'+(m.quartier||'—')+'</td>'+
        '<td>'+genreBadge(m.genre)+'</td>'+
        '<td>'+ministereBadge(m.ministere)+'</td>'+
        '<td style="font-size:11.5px">'+formatDate(m.dateBapteme)+'</td>'+
        '<td style="font-size:11.5px">'+(m.egliseMaison||'—')+'</td>'+
        '<td style="font-size:11.5px">'+(m.ville||'—')+'</td>'+
        '<td style="font-size:11px;color:var(--text2)">'+(m.nomDirigeant||'—')+'</td>'+
        '<td style="font-size:11px;color:var(--text2)">'+(m.formateur||'—')+'</td>'+
        '<td>'+statutBadge(m.statut)+'</td>'+
        '<td onclick="event.stopPropagation()"><div class="btn-group">'+
          '<button class="btn btn-ghost btn-sm" style="padding:4px 8px" onclick="editMembre('+m.id+')"><i class="fas fa-edit"></i></button>'+
          '<button class="btn btn-danger btn-sm" style="padding:4px 8px" onclick="deleteMembre('+m.id+')"><i class="fas fa-trash"></i></button>'+
        '</div></td></tr>'
    ).join('');
  }

  function voirMembre(id) { const m=DB.membres.find(x=>x.id===id); if(!m) return; const body='<div class="g2" style="margin-bottom:14px"><div><div class="fld-lbl">Nom & Prénoms</div><div style="font-weight:700;font-size:14px">'+m.nom+' '+m.prenoms+'</div></div><div><div class="fld-lbl">Genre & Ministère</div><div>'+genreBadge(m.genre)+' '+ministereBadge(m.ministere)+'</div></div><div><div class="fld-lbl">Contact</div><div>'+(m.contact||'—')+'</div></div><div><div class="fld-lbl">Quartier</div><div>'+(m.quartier||'—')+'</div></div><div><div class="fld-lbl">Profession</div><div>'+(m.profession||'—')+'</div></div><div><div class="fld-lbl">Date de Baptême</div><div>'+formatDate(m.dateBapteme)+'</div></div><div><div class="fld-lbl">Église de Maison (DB)</div><div>'+(m.egliseMaison||'—')+'</div></div><div><div class="fld-lbl">Ville</div><div>'+(m.ville||'—')+'</div></div><div><div class="fld-lbl">Nom du Dirigeant</div><div>'+(m.nomDirigeant||'—')+'</div></div><div><div class="fld-lbl">Formateur/Trice</div><div>'+(m.formateur||'—')+'</div></div><div><div class="fld-lbl">Statut</div><div>'+statutBadge(m.statut)+'</div></div></div>';
    const footer='<button class="btn btn-ghost" onclick="closeModal()">Fermer</button><button class="btn btn-primary" onclick="closeModal();editMembre('+id+')"><i class="fas fa-edit"></i>Modifier</button>';
    openModal('✝ Fiche de '+m.nom+' '+m.prenoms, body, footer);

  // ============================================================
  // FONCTION DE SAUVEGARDE DES STATISTIQUES AVEC AUTO-CALCUL ET REPRISE
  // ============================================================
  function saveStatsDirect() {
    const y = document.getElementById('ss-year')?.value || '2025';
    const m = document.getElementById('ss-mois')?.value || '01';
    const ville = document.getElementById('ss-ville-select')?.value || 'Man';
    const key = y + '-' + m + '-' + ville;

    function getVal(id) {
      const el = document.getElementById(id);
      if (!el) return 0;
      const v = parseInt(el.value);
      return isNaN(v) ? 0 : v;
    }

    // Effectif début
    const effH = getVal('ss-effH');
    const effF = getVal('ss-effF');

    // Récupération des mouvements
    const mov = {};
    STATS_TYPES.forEach(st => {
      mov[st.key + 'H'] = getVal('ss-' + st.key + 'H');
      mov[st.key + 'F'] = getVal('ss-' + st.key + 'F');
    });

    const baptH = mov.baptH, baptF = mov.baptF;
    const restH = mov.restH, restF = mov.restF;
    const arrH = mov.arrH, arrF = mov.arrF;
    const depH = mov.depH, depF = mov.depF;
    const retroH = mov.retroH, retroF = mov.retroF;
    const decH = mov.decH, decF = mov.decF;
    const assistMoy = getVal('ss-assist');

    // Calcul effectif fin
    const finH = effH + baptH + restH + arrH - depH - retroH - decH;
    const finF = effF + baptF + restF + arrF - depF - retroF - decF;

    // Enregistrer les stats du mois courant pour cette ville
    DB.statsM[key] = {
      effH, effF,
      baptH, baptF,
      restH, restF,
      arrH, arrF,
      depH, depF,
      retroH, retroF,
      decH, decF,
      assistMoy
    };

    // Mise à jour automatique de l'effectif du mois suivant pour la même ville
    const nextMonth = new Date(parseInt(y), parseInt(m) - 1 + 1, 1);
    const nextKey = nextMonth.getFullYear() + '-' + String(nextMonth.getMonth() + 1).padStart(2, '0') + '-' + ville;
    if (!DB.statsM[nextKey]) {
      DB.statsM[nextKey] = { effH: finH, effF: finF, baptH:0, baptF:0, restH:0, restF:0, arrH:0, arrF:0, depH:0, depF:0, retroH:0, retroF:0, decH:0, decF:0, assistMoy:0 };
    } else {
      DB.statsM[nextKey].effH = finH;
      DB.statsM[nextKey].effF = finF;
    }

    // Création des mouvements individuels
    const moisNom = MOIS_NOMS[parseInt(m) - 1];
    const dateStr = y + '-' + m + '-01';

    const typesMouv = [
      { type: 'Baptême', H: baptH, F: baptF, nomH: 'Nouveau baptisé', nomF: 'Nouvelle baptisée' },
      { type: 'Restauration', H: restH, F: restF, nomH: 'Restauré', nomF: 'Restaurée' },
      { type: 'Arrivée', H: arrH, F: arrF, nomH: 'Nouvel arrivant', nomF: 'Nouvelle arrivante' },
      { type: 'Départ', H: depH, F: depF, nomH: 'Départ', nomF: 'Départ' },
      { type: 'Rétrogradé', H: retroH, F: retroF, nomH: 'Rétrogradé', nomF: 'Rétrogradée' },
      { type: 'Décès', H: decH, F: decF, nomH: 'Décédé', nomF: 'Décédée' }
    ];

    typesMouv.forEach(t => {
      if (t.H > 0) {
        for (let i = 0; i < t.H; i++) {
          DB.mouvements.push({
            id: getNextId(DB.mouvements),
            date: dateStr,
            type: t.type,
            nom: t.nomH,
            prenom: '(Frère ' + (i+1) + ')',
            genre: 'H',
            detail: t.type + ' - ' + moisNom + ' ' + y + ' (' + ville + ')',
            ville: ville
          });
        }
      }
      if (t.F > 0) {
        for (let i = 0; i < t.F; i++) {
          DB.mouvements.push({
            id: getNextId(DB.mouvements),
            date: dateStr,
            type: t.type,
            nom: t.nomF,
            prenom: '(Sœur ' + (i+1) + ')',
            genre: 'F',
            detail: t.type + ' - ' + moisNom + ' ' + y + ' (' + ville + ')',
            ville: ville
          });
        }
      }
    });

    saveData();
    showNotification('✓ Stats enregistrées pour ' + ville + ' - Effectif fin: ' + finH + ' Frères, ' + finF + ' Sœurs', 'success');
    renderStatsTable();
    updateBadges();
    if (currentPage === 'mouvements') buildMouvements(document.getElementById('page-mouvements'));
  }

  function renderStatsTable() {
    const year = document.getElementById('stats-year')?.value || '2025';
    const selectedCity = document.getElementById('stats-city')?.value || 'Toutes';

    const sections = [
      ['Effectif début','eff'],
      ['Baptême','bapt'],
      ['Restauration','rest'],
      ['Arrivées','arr'],
      ['Départs','dep'],
      ['Rétrogradés','retro'],
      ['Décès','dec'],
      ['Effectif fin (calc.)','fin'],
      ['Croissance','crois']
    ];

    let thead = '<table class="dtable" style="min-width:1000px"><thead><tr style="background:rgba(124,58,237,.15)"><th style="width:130px">Mois</th>'+sections.map(s=>'<th colspan="3" style="text-align:center;border-left:1px solid rgba(255,255,255,.1)">'+s[0]+'</th>').join('')+'<th>Assis.</th></tr><tr><th></th>'+sections.map(()=>'<th>F</th><th>S</th><th>Tot</th>').join('')+'<th></th></tr></thead><tbody>';
    let rows='';

    MOIS_NOMS.forEach((mois,i)=>{
      const monthKey = year + '-' + String(i+1).padStart(2,'0');
      // Récupérer les données pour la ville sélectionnée
      let s = null;
      if (selectedCity === 'Toutes') {
        // Somme sur toutes les villes
        s = { effH:0, effF:0, baptH:0, baptF:0, restH:0, restF:0, arrH:0, arrF:0, depH:0, depF:0, retroH:0, retroF:0, decH:0, decF:0, assistMoy:0 };
        Object.keys(DB.statsM).forEach(key => {
          if (key.startsWith(monthKey + '-')) {
            const data = DB.statsM[key];
            for (let field in s) {
              if (field !== 'assistMoy') s[field] += data[field] || 0;
            }
            s.assistMoy += data.assistMoy || 0;
          }
        });
        // moyenne de l'assistance
        const count = Object.keys(DB.statsM).filter(k => k.startsWith(monthKey + '-')).length;
        if (count > 0) s.assistMoy = Math.round(s.assistMoy / count);
        // Pour l'effectif début, si on somme, on perd le sens : on prend la première ville ? Mieux vaut ne pas afficher "Toutes" pour l'effectif début car il n'a pas de sens.
        // On va afficher "—" pour eff début et fin si Toutes.
        // Mais on peut afficher le total des effectifs début = somme des débuts de chaque ville.
        // Cependant, cela peut être trompeur. On va garder la somme pour l'instant.
      } else {
        const key = monthKey + '-' + selectedCity;
        s = DB.statsM[key] || {};
      }

      const hasData = Object.keys(s).length > 0 && (s.effH || s.effF);

      function getVals(sk) {
        if(sk==='eff') return [s.effH||0, s.effF||0];
        if(sk==='bapt') return [s.baptH||0, s.baptF||0];
        if(sk==='rest') return [s.restH||0, s.restF||0];
        if(sk==='arr') return [s.arrH||0, s.arrF||0];
        if(sk==='dep') return [s.depH||0, s.depF||0];
        if(sk==='retro') return [s.retroH||0, s.retroF||0];
        if(sk==='dec') return [s.decH||0, s.decF||0];
        if(sk==='fin') {
          const effH = s.effH || 0;
          const effF = s.effF || 0;
          const finH = effH + (s.baptH||0) + (s.restH||0) + (s.arrH||0) - (s.depH||0) - (s.retroH||0) - (s.decH||0);
          const finF = effF + (s.baptF||0) + (s.restF||0) + (s.arrF||0) - (s.depF||0) - (s.retroF||0) - (s.decF||0);
          return [finH, finF];
        }
        if(sk==='crois') {
          const effH = s.effH || 0;
          const effF = s.effF || 0;
          const finH = effH + (s.baptH||0) + (s.restH||0) + (s.arrH||0) - (s.depH||0) - (s.retroH||0) - (s.decH||0);
          const finF = effF + (s.baptF||0) + (s.restF||0) + (s.arrF||0) - (s.depF||0) - (s.retroF||0) - (s.decF||0);
          return [finH - effH, finF - effF];
        }
        return [0,0];
      }

      rows += '<tr'+(hasData?' style="background:rgba(124,58,237,.05)"':'')+'><td style="font-weight:600;white-space:nowrap">'+mois+' <span style="font-size:10px;color:var(--text3)">'+year+'</span></td>'+
        sections.map(sec=>{ const sk=sec[1]; const vals=getVals(sk); const h=vals[0], f=vals[1]; const t=h+f; let col=''; if(sk==='crois'){ col=t>0?'var(--green)':t<0?'var(--red)':'var(--text3)'; } const style=col?'color:'+col+';font-weight:700':''; return '<td style="text-align:center;'+style+'">'+(h||'—')+'</td><td style="text-align:center;'+style+'">'+(f||'—')+'</td><td style="text-align:center;font-weight:600;'+(col?'color:'+col:'')+'">'+(t||'—')+'</td>'; }).join('')+
        '<td style="text-align:center">'+(s.assistMoy||'—')+'</td></tr>';
    });

    // Total (uniquement les mouvements cumulés)
    // Pour "Toutes", on peut afficher un total, mais pour une ville spécifique, on affiche la somme des mouvements de cette ville.
    const totalRows = sections.map(sec=>{ const sk=sec[1]; let totH=0,totF=0;
      if (selectedCity === 'Toutes') {
        // Somme sur toutes les villes
        Object.keys(DB.statsM).forEach(key => {
          if (key.startsWith(year)) {
            const data = DB.statsM[key];
            if(sk==='eff'||sk==='fin'||sk==='crois') return;
            totH += data[sk+'H']||0;
            totF += data[sk+'F']||0;
          }
        });
      } else {
        // Une seule ville
        for(let i=1; i<=12; i++) {
          const key = year + '-' + String(i).padStart(2,'0') + '-' + selectedCity;
          const data = DB.statsM[key] || {};
          if(sk==='eff'||sk==='fin'||sk==='crois') return '<td style="text-align:center">—</td><td style="text-align:center">—</td><td style="text-align:center">—</td>';
          totH += data[sk+'H']||0;
          totF += data[sk+'F']||0;
        }
      }
      if(sk==='eff'||sk==='fin'||sk==='crois') return '<td style="text-align:center">—</td><td style="text-align:center">—</td><td style="text-align:center">—</td>';
      return '<td style="text-align:center">'+totH+'</td><td style="text-align:center">'+totF+'</td><td style="text-align:center">'+(totH+totF)+'</td>';
    }).join('');

    rows += '<tr style="background:rgba(124,58,237,.18);font-weight:700"><td>TOTAL</td>'+totalRows+'<td></td></tr>';
    document.getElementById('stats-body').innerHTML = thead + rows + '</tbody></table>';

    // Charts
    setTimeout(()=>{
      const year2=document.getElementById('stats-year')?.value||'2025';
      const labels=MOIS_NOMS.map(m=>m.slice(0,3));

      // Données pour le graphique : effectif et arrivées/départs
      let effData=[], arrData=[], depData=[];
      const city = document.getElementById('stats-city')?.value || 'Toutes';

      if (city === 'Toutes') {
        // Somme sur toutes les villes
        for(let i=0; i<12; i++) {
          const m = String(i+1).padStart(2,'0');
          let eff=0, arr=0, dep=0;
          Object.keys(DB.statsM).forEach(key => {
            if (key.startsWith(year2 + '-' + m + '-')) {
              const data = DB.statsM[key];
              eff += (data.effH||0) + (data.effF||0);
              arr += (data.arrH||0) + (data.arrF||0);
              dep += (data.depH||0) + (data.depF||0);
            }
          });
          effData.push(eff);
          arrData.push(arr);
          depData.push(dep);
        }
      } else {
        // Une seule ville
        for(let i=0; i<12; i++) {
          const m = String(i+1).padStart(2,'0');
          const key = year2 + '-' + m + '-' + city;
          const data = DB.statsM[key] || {};
          effData.push((data.effH||0) + (data.effF||0));
          arrData.push((data.arrH||0) + (data.arrF||0));
          depData.push((data.depH||0) + (data.depF||0));
        }
      }

      const ctx1=document.getElementById('chart-stats-evo');
      if(ctx1){ if(chartInstances['cs-evo']) chartInstances['cs-evo'].destroy(); chartInstances['cs-evo']=new Chart(ctx1,{ type:'line', data:{ labels, datasets:[{ label:'Effectif', data:effData, borderColor:'#818CF8', backgroundColor:'rgba(99,102,241,.12)', fill:true, tension:0.4, pointRadius:4, pointBackgroundColor:'#818CF8' }] }, options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ labels:{ color:'rgba(148,163,184,1)', font:{size:11} } } }, scales:{ x:{ grid:{display:false}, ticks:{color:'rgba(100,116,139,1)'} }, y:{ grid:{color:'rgba(255,255,255,.05)'}, ticks:{ precision:0, color:'rgba(100,116,139,1)' } } } } }); }
      const ctx2=document.getElementById('chart-stats-mouv');
      if(ctx2){ if(chartInstances['cs-mouv']) chartInstances['cs-mouv'].destroy(); chartInstances['cs-mouv']=new Chart(ctx2,{ type:'bar', data:{ labels, datasets:[ { label:'Arrivées', data:arrData, backgroundColor:'rgba(16,185,129,.65)', borderRadius:5 }, { label:'Départs', data:depData, backgroundColor:'rgba(239,68,68,.65)', borderRadius:5 } ] }, options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ labels:{ color:'rgba(148,163,184,1)', font:{size:11} } } }, scales:{ x:{ grid:{display:false}, ticks:{color:'rgba(100,116,139,1)'} }, y:{ grid:{color:'rgba(255,255,255,.05)'}, beginAtZero:true, ticks:{ precision:0, color:'rgba(100,116,139,1)' } } } } }); }
    }, 100);
  }

  function saveStatsModal() {
    const y=document.getElementById('ss-year-modal')?.value||'2025';
    const m=document.getElementById('ss-mois-modal')?.value||'01';
    const ville=document.getElementById('ss-ville-modal')?.value||'Man';
    const key = y + '-' + m + '-' + ville;

    function getVal(id) {
      const el = document.getElementById(id);
      if (!el) return 0;
      const v = parseInt(el.value);
      return isNaN(v) ? 0 : v;
    }

    const effH = getVal('ss-effH-modal');
    const effF = getVal('ss-effF-modal');

    const mov = {};
    STATS_TYPES.forEach(st => {
      mov[st.key + 'H'] = getVal('ss-' + st.key + 'H-modal');
      mov[st.key + 'F'] = getVal('ss-' + st.key + 'F-modal');
    });

    const baptH = mov.baptH, baptF = mov.baptF;
    const restH = mov.restH, restF = mov.restF;
    const arrH = mov.arrH, arrF = mov.arrF;
    const depH = mov.depH, depF = mov.depF;
    const retroH = mov.retroH, retroF = mov.retroF;
    const decH = mov.decH, decF = mov.decF;
    const assistMoy = getVal('ss-assist-modal');

    const finH = effH + baptH + restH + arrH - depH - retroH - decH;
    const finF = effF + baptF + restF + arrF - depF - retroF - decF;

    DB.statsM[key] = {
      effH, effF,
      baptH, baptF,
      restH, restF,
      arrH, arrF,
      depH, depF,
      retroH, retroF,
      decH, decF,
      assistMoy
    };

    // Mise à jour du mois suivant pour la même ville
    const nextMonth = new Date(parseInt(y), parseInt(m)-1 + 1, 1);
    const nextKey = nextMonth.getFullYear() + '-' + String(nextMonth.getMonth()+1).padStart(2,'0') + '-' + ville;
    if (!DB.statsM[nextKey]) {
      DB.statsM[nextKey] = { effH: finH, effF: finF, baptH:0, baptF:0, restH:0, restF:0, arrH:0, arrF:0, depH:0, depF:0, retroH:0, retroF:0, decH:0, decF:0, assistMoy:0 };
    } else {
      DB.statsM[nextKey].effH = finH;
      DB.statsM[nextKey].effF = finF;
    }

    // Création des mouvements individuels
    const moisNom = MOIS_NOMS[parseInt(m) - 1];
    const dateStr = y + '-' + m + '-01';

    const typesMouv = [
      { type: 'Baptême', H: baptH, F: baptF, nomH: 'Nouveau baptisé', nomF: 'Nouvelle baptisée' },
      { type: 'Restauration', H: restH, F: restF, nomH: 'Restauré', nomF: 'Restaurée' },
      { type: 'Arrivée', H: arrH, F: arrF, nomH: 'Nouvel arrivant', nomF: 'Nouvelle arrivante' },
      { type: 'Départ', H: depH, F: depF, nomH: 'Départ', nomF: 'Départ' },
      { type: 'Rétrogradé', H: retroH, F: retroF, nomH: 'Rétrogradé', nomF: 'Rétrogradée' },
      { type: 'Décès', H: decH, F: decF, nomH: 'Décédé', nomF: 'Décédée' }
    ];

    typesMouv.forEach(t => {
      if (t.H > 0) {
        for (let i = 0; i < t.H; i++) {
          DB.mouvements.push({
            id: getNextId(DB.mouvements),
            date: dateStr,
            type: t.type,
            nom: t.nomH,
            prenom: '(Frère ' + (i+1) + ')',
            genre: 'H',
            detail: t.type + ' - ' + moisNom + ' ' + y + ' (' + ville + ')',
            ville: ville
          });
        }
      }
      if (t.F > 0) {
        for (let i = 0; i < t.F; i++) {
          DB.mouvements.push({
            id: getNextId(DB.mouvements),
            date: dateStr,
            type: t.type,
            nom: t.nomF,
            prenom: '(Sœur ' + (i+1) + ')',
            genre: 'F',
            detail: t.type + ' - ' + moisNom + ' ' + y + ' (' + ville + ')',
            ville: ville
          });
        }
      }
    });

    saveData();
    closeModal();
    showNotification('✓ Stats enregistrées pour ' + ville + ' - Effectif fin: ' + finH + ' Frères, ' + finF + ' Sœurs', 'success');
    renderStatsTable();
    updateBadges();
    if (currentPage === 'mouvements') buildMouvements(document.getElementById('page-mouvements'));
  }

ctif par ministère :</div>'+minHtml+'</div><div><div style="font-size:11.5px;color:var(--text2);margin-bottom:6px;font-weight:600">Effectif par DB :</div>'+dbHtml+'</div></div></div><div class="divider"></div><div style="text-align:center;font-size:11.5px;color:var(--text3)"><i class="fas fa-info-circle"></i> Toutes les données sont stockées localement. Sauvegardez via les exports CSV.</div></div></div>';

    const minRows=Object.keys(minStats).map(min=>{ const d=minStats[min]; return '<tr><td>'+min+'</td><td>'+d.H+'</td><td>'+d.F+'</td><td><strong>'+(d.H+d.F)+'</strong></td></tr>'; }).join('');
    const membresRows=DB.membres.filter(m=>m.statut==='Actif').map(m=>'<tr><td>'+m.id+'</td><td><strong>'+m.nom+'</strong></td><td>'+m.prenoms+'</td><td>'+(m.genre==='H'?'Frère':'Sœur')+'</td><td>'+m.ministere+'</td><td>'+(m.egliseMaison||'—')+'</td><td>'+(m.ville||'—')+'</td><td>'+(m.nomDirigeant||'—')+'</td><td>'+(m.contact||'—')+'</td><td>'+(m.dateBapteme||'—')+'</td></tr>').join('');
    win.document.write('<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><title>Rapport Église de '+cfg.ville+'</title><style>body{font-family:Arial,sans-serif;padding:30px;color:#333}h1{color:#7C3AED;border-bottom:3px solid #7C3AED;padding-bottom:8px}h2{color:#555;margin-top:20px}table{width:100%;border-collapse:collapse;margin-top:10px}th{background:#7C3AED;color:#fff;padding:8px;text-align:left;font-size:12px}td{padding:7px 8px;border-bottom:1px solid #eee;font-size:12px}tr:nth-child(even){background:#f9f9f9}.info{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0;background:#f0ebff;padding:14px;border-radius:8px}.info div{font-size:13px}</style></head><body><h1>✝ Rapport — Église de '+cfg.ville+'</h1><div class="info"><div><strong>Ville :</strong> '+cfg.ville+'</div><div><strong>Région :</strong> '+cfg.region+'</div><div><strong>Dirigeant :</strong> '+cfg.dirigeant+'</div><div><strong>Contact :</strong> '+cfg.contact+'</div><div><strong>Date :</strong> '+new Date().toLocaleDateString('fr-FR')+'</div></div><h2>📊 Statistiques générales</h2><table><thead><tr><th>Indicateur</th><th>Frères</th><th>Sœurs</th><th>Total</th></tr></thead><tbody><tr><td>Membres actifs</td><td>'+stats.freres+'</td><td>'+stats.soeurs+'</td><td>'+stats.total+'</td></tr></tbody></table><h2>⛪ Répartition par ministère</h2><table><thead><tr><th>Ministère</th><th>Frères</th><th>Sœurs</th><th>Total</th></tr></thead><tbody>'+minRows+'</tbody></table><h2>👥 Registre complet des membres</h2><table><thead><tr><th>N°</th><th>Nom</th><th>Prénoms</th><th>Genre</th><th>Ministère</th><th>DB</th><th>Ville</th><th>Dirigeant</th><th>Contact</th><th>Baptême</th></tr></thead><tbody>'+membresRows+'</tbody></table><p style="margin-top:20px;font-size:11px;color:#999;text-align:center">Rapport généré le '+new Date().toLocaleString('fr-FR')+' · Application Gestion Église Man</p><script>window.print();<\/script></body></html>');
    win.document.close();
  }

  // ============================================================
  // THÈME & INIT
  // ============================================================
  document.getElementById('theme-sel').addEventListener('change', function() {
    const val=this.value; document.body.className=val==='light'?'light':''; localStorage.setItem('eglise_theme',val);
  });
  const savedTheme=localStorage.getItem('eglise_theme');
  if(savedTheme){ document.body.className=savedTheme==='light'?'light':''; document.getElementById('theme-sel').value=savedTheme; }
  document.querySelectorAll('.nav-btn[data-page]').forEach(btn=>btn.addEventListener('click', function(){ navigateTo(this.dataset.page); }));
  document.getElementById('modal-overlay').addEventListener('click', function(e){ if(e.target===this) closeModal(); });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeModal(); });
  updateBadges(); navigateTo('accueil');
</script>
